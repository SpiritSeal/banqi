name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Same ref (PR or branch) cancels older in-progress runs. Pushes to main
# don't cancel each other so every merge commit gets verified end-to-end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Native test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run doctest suite
        working-directory: ${{ github.workspace }}
        run: make test

  # Build WASM once and share with the three jobs below via an artifact.
  # Previously each of server, wasm-smoke, playwright installed emsdk and ran
  # `make wasm` independently — ~3× duplicated work per CI run.
  build-wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten (emsdk)
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly
        run: |
          source emsdk/emsdk_env.sh
          make wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            web/banqi.js
            web/banqi.wasm
          if-no-files-found: error
          retention-days: 1

  server:
    name: Relay server tests
    needs: build-wasm
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banqi_test
          POSTGRES_USER: banqi
          POSTGRES_PASSWORD: banqi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: web/

      - name: Install relay deps
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Run relay integration tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://banqi:banqi@localhost:5432/banqi_test
        run: npm test

  wasm-smoke:
    name: WASM smoke (in-process)
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: web/

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: WASM smoke (in-process)
        run: node tests/wasm_smoke.mjs

      - name: Replay-layer smoke
        run: node tests/replay_smoke.mjs

      - name: Board hints smoke
        run: node tests/board_hints_smoke.mjs

      # Stamp before the PWA + SW checks so they see real BUILD_ID + APP_SHELL
      # values instead of the placeholders committed in web/sw.js.
      - name: Stamp service worker
        run: node scripts/stamp-sw.mjs

      - name: PWA manifest check
        run: node tests/pwa_manifest.mjs

      - name: Service-worker BUILD_ID test
        run: node tests/sw_buildid.mjs

  playwright:
    name: Playwright end-to-end
    needs: build-wasm
    runs-on: ubuntu-latest
    # Postgres needed by tests that boot the real relay (e.g.
    # online_game_teleport_smoke). The browser-only tests
    # (board_input_browser, pwa_smoke) don't touch it but cohabit cheaply.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banqi_test
          POSTGRES_USER: banqi
          POSTGRES_PASSWORD: banqi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: web/

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install relay deps
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Stamp service worker
        run: node scripts/stamp-sw.mjs

      - name: Online-game teleport regression (#98)
        env:
          DATABASE_URL: postgresql://banqi:banqi@localhost:5432/banqi_test
        run: node tests/online_game_teleport_smoke.mjs

      - name: View-lifecycle smoke (#99)
        env:
          DATABASE_URL: postgresql://banqi:banqi@localhost:5432/banqi_test
        run: node tests/view_lifecycle_smoke.mjs

      - name: View-lifecycle fuzz (#100)
        env:
          DATABASE_URL: postgresql://banqi:banqi@localhost:5432/banqi_test
        run: node tests/view_lifecycle_fuzz.mjs

      - name: Sign-in / sign-out lifecycle smoke (#101)
        env:
          DATABASE_URL: postgresql://banqi:banqi@localhost:5432/banqi_test
        run: node tests/lifecycle_signin_signout_smoke.mjs

      - name: Board input (touch + drag)
        run: node tests/board_input_browser.mjs

      - name: PWA offline smoke
        run: node tests/pwa_smoke.mjs

      - name: PWA install prompt (#17)
        run: node tests/pwa_install_prompt.mjs

  timing:
    name: Timing summary
    needs: [test, build-wasm, server, wasm-smoke, playwright]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Per-step durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '
              .jobs
              | map(select(.name != "Timing summary"))
              | .[]
              | (
                  "## \(.name) — \(if .started_at and .completed_at
                    then (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor | tostring) + "s"
                    else "n/a" end) (\(.conclusion // "running"))"
                ),
                "",
                "| Step | Seconds |",
                "|------|---------|",
                (
                  .steps[]
                  | "| \(.name) | \(if .started_at and .completed_at
                      then (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor | tostring)
                      else "-" end) |"
                ),
                ""
            ' >> "$GITHUB_STEP_SUMMARY"
