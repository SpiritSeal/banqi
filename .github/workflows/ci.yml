name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Native test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build and run doctest suite
        working-directory: ${{ github.workspace }}
        run: make test

  server:
    name: Relay server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: banqi_test
          POSTGRES_USER: banqi
          POSTGRES_PASSWORD: banqi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The server loads the Banqi WASM in-process to validate every intent,
      # so this job needs the compiled module. Cache emsdk so cold-start cost
      # is paid once.
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten (emsdk)
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly
        run: |
          source emsdk/emsdk_env.sh
          make wasm

      - name: Install relay deps
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Run relay integration tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://banqi:banqi@localhost:5432/banqi_test
        run: npm test

  wasm-smoke:
    name: WASM smoke (in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-buildid compares HEAD to origin/main, which needs full
          # history (default is a shallow clone with only HEAD).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten (emsdk)
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly
        run: |
          source emsdk/emsdk_env.sh
          make wasm

      - name: Install npm deps
        run: npm install

      - name: WASM smoke (in-process)
        run: node tests/wasm_smoke.mjs

      - name: Replay-layer smoke
        run: node tests/replay_smoke.mjs

      - name: Board hints smoke
        run: node tests/board_hints_smoke.mjs

      - name: Stamp service worker
        run: node scripts/stamp-sw.mjs

      - name: PWA manifest check
        run: node tests/pwa_manifest.mjs

      - name: Service-worker BUILD_ID test
        run: node tests/sw_buildid.mjs

      - name: Cross-commit BUILD_ID guard
        run: node scripts/check-buildid.mjs
