name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Native test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build and run doctest suite
        working-directory: ${{ github.workspace }}
        run: make test

  e2e:
    name: Real-browser E2E (PeerJS / WebRTC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: WASM smoke (in-process)
        run: node tests/wasm_smoke.mjs

      - name: Relay protocol tests (Node-level, no browser)
        run: node tests/test_relay.mjs

      - name: Browser E2E (PeerJS) — casual mode
        run: node tests/e2e_browser.mjs casual

      - name: Browser E2E (PeerJS) — crypto mode
        run: node tests/e2e_browser.mjs crypto

      - name: Browser E2E (LAN relay) — casual mode
        run: node tests/e2e_relay.mjs casual

      - name: Browser E2E (LAN relay) — crypto mode
        run: node tests/e2e_relay.mjs crypto

      - name: Browser E2E scenarios (third-client, resign, full game, …)
        run: node tests/e2e_scenarios.mjs
