name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deployment at a time; cancel in-progress run if a new push arrives.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM + package web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten (emsdk)
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly
        run: |
          source emsdk/emsdk_env.sh
          make wasm

      - name: Run native tests (quick sanity check)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q g++
          make test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy-pages:
    name: Deploy to GitHub Pages
    # GitHub Pages only publishes from one branch (main). The build job above
    # still runs on every triggered branch so we get WASM-compile coverage,
    # but actual Pages publication is gated on main to avoid the deploy-pages
    # action failing on non-default branches.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudrun:
    name: Deploy to Cloud Run
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten (emsdk)
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly (needed for Docker image)
        run: |
          source emsdk/emsdk_env.sh
          make wasm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/banqi/banqi-relay:${{ github.sha }}"
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: banqi-relay
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/banqi/banqi-relay:${{ github.sha }}
          flags: --add-cloudsql-instances=${{ vars.GCP_CLOUD_SQL_INSTANCE }}
