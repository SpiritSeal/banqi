name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/banqi-game-implementation-NXe80
      - claude/federated-multiplayer-game-MvynQ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress run if a new push arrives.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM + package web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Install Emscripten (emsdk)
        run: |
          if [ ! -d emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly
        run: |
          source emsdk/emsdk_env.sh
          make wasm

      - name: Run native tests (quick sanity check)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q g++
          make test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
